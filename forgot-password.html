<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Forgot Password | METRO LOAN</title>
    <link rel="stylesheet" href="css/forgot-password.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/site-footer.css">
    <script src="js/main.js" defer></script>
    <script src="js/site-chrome.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="nav-container">
            <a href="index.html" class="brand" aria-label="METRO LOAN Home">
                <span class="brand-mark">M</span>
                <span class="brand-name">METRO LOAN</span>
            </a>
            <button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="main-nav">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav class="main-nav" id="main-nav">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="loans.html">Loans</a>
                <a href="how-it-works.html">How It Works</a>
                <a href="calculator.html">Calculator</a>
                <a href="faq.html">FAQ</a>
                <a href="contact.html">Contact</a>
            </nav>
            <div class="nav-actions">
                <a href="login.html" class="login-link">Login</a>
                <a href="register.html" class="nav-button">Get Started</a>
            </div>
        </div>
    </header>

    <main class="auth-area">
        <section class="auth-card">
            <a href="index.html" class="auth-brand">
                <span class="brand-mark">M</span>
                <span class="brand-name">METRO LOAN</span>
            </a>
            <span class="section-label">ACCOUNT ACCESS</span>
            <h1>Reset your password</h1>
            <p class="auth-description">Enter the email address associated with your account.</p>
            <form id="forgot-password-form">
                <label for="reset-email">Email Address</label>
                <input type="email" id="reset-email" placeholder="Enter your email address" required>
                <button type="button" class="primary-button" id="reset-password-button">Send Reset Link</button>
            </form>
            <p class="auth-switch"><a href="login.html">Back to Login</a></p>
        </section>
    </main>

    <footer class="site-footer"></footer>
</body>
</html>
